<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dados da Sala</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

#login{
    max-width:400px;
    margin:100px auto;
    background:#1e1e1e;
    padding:20px;
    border-radius:10px;
    border:1px solid #333;
}

#site{
    display:none;
}

h1,h2{
    text-align:center;
    color:#00ff88;
}

input, textarea{
    width:100%;
    padding:10px;
    margin:5px 0;
    background:#222;
    color:white;
    border:1px solid #444;
    border-radius:5px;
    box-sizing:border-box;
}

textarea{
    height:100px;
    resize:vertical;
}

button{
    padding:10px;
    margin:5px 0;
    border:none;
    border-radius:5px;
    cursor:pointer;
    font-weight:bold;
}

.btn{
    width:100%;
    background:#00ff88;
}

.bloco{
    background:#1e1e1e;
    padding:15px;
    border-radius:10px;
    border:1px solid #333;
    margin-bottom:15px;
    transition:0.3s;
}

.bloco:hover{
    transform:translateY(-3px);
    box-shadow:0 0 15px rgba(0,255,136,0.3);
}

.excluir{
    background:#ff4444;
    color:white;
    width:100%;
}

.topo{
    display:flex;
    gap:10px;
    margin-bottom:15px;
}

.topo button{
    flex:1;
}

#contador{
    text-align:center;
    margin-bottom:20px;
    color:#00ff88;
    font-weight:bold;
}

</style>
</head>
<body>

<div id="login">

<h2>Login</h2>

<input type="text" id="usuario" placeholder="Usuário">

<input type="password" id="senha" placeholder="Senha">

<button class="btn" onclick="entrar()">
Entrar
</button>

</div>

<div id="site">

<h1>DADOS DA SALA</h1>

<div id="contador">
Total de registros: 0
</div>

<input
type="text"
id="pesquisa"
placeholder="🔍 Pesquisar nome..."
onkeyup="pesquisar()">

<div class="topo">

<button class="btn" onclick="novoBloco()">
➕ Novo Registro
</button>

<button class="btn" onclick="limparPesquisa()">
🗑️ Limpar Pesquisa
</button>

</div>

<div id="container"></div>

<button class="btn" onclick="salvarDados()">
💾 Salvar Dados
</button>

</div>

<script>

function entrar(){

    const usuario =
    document.getElementById("usuario").value;

    const senha =
    document.getElementById("senha").value;

    if(usuario === "macaco" &&
       senha === "bet"){

        document.getElementById("login")
        .style.display = "none";

        document.getElementById("site")
        .style.display = "block";

        carregarDados();

    }else{

        alert("Usuário ou senha incorretos!");

    }

}

function novoBloco(nome="",dados=""){

    const bloco =
    document.createElement("div");

    bloco.className = "bloco";

    bloco.innerHTML = `

    <input
    type="text"
    placeholder="Nome"
    class="nome"
    value="${nome}">

    <textarea
    placeholder="Dados"
    class="dados">${dados}</textarea>

    <button
    class="excluir"
    onclick="excluirBloco(this)">
    ❌ Excluir
    </button>

    `;

    document
    .getElementById("container")
    .appendChild(bloco);

    atualizarContador();

}

for(let i=0;i<30;i++){
    novoBloco();
}

function excluirBloco(botao){

    botao.parentElement.remove();

    salvarDados();

    atualizarContador();

}

function atualizarContador(){

    const total =
    document
    .querySelectorAll(".bloco")
    .length;

    document
    .getElementById("contador")
    .innerText =
    "Total de registros: " + total;

}

function salvarDados(){

    const nomes =
    document.querySelectorAll(".nome");

    const dados =
    document.querySelectorAll(".dados");

    let lista = [];

    for(let i=0;i<nomes.length;i++){

        lista.push({

            nome:nomes[i].value,

            dados:dados[i].value

        });

    }

    localStorage.setItem(
        "dadosSala",
        JSON.stringify(lista)
    );

}

function carregarDados(){

    const salvos =
    JSON.parse(
    localStorage.getItem("dadosSala"));

    if(!salvos) return;

    document
    .getElementById("container")
    .innerHTML = "";

    salvos.forEach(item=>{

        novoBloco(
            item.nome,
            item.dados
        );

    });

}

function pesquisar(){

    const texto =
    document
    .getElementById("pesquisa")
    .value
    .toLowerCase();

    const blocos =
    document
    .querySelectorAll(".bloco");

    blocos.forEach(bloco=>{

        const nome =
        bloco
        .querySelector(".nome")
        .value
        .toLowerCase();

        bloco.style.display =
        nome.includes(texto)
        ? "block"
        : "none";

    });

}

function limparPesquisa(){

    document
    .getElementById("pesquisa")
    .value = "";

    pesquisar();

}

document.addEventListener(
"input",
salvarDados
);

</script>

</body>
</html>
